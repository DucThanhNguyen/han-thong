<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Tùy chọn Hán Thông</title>
    <meta charset="utf-8"/>
    <link rel="shortcut icon" href="images/icon128.png"/>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css"/>
    <style>
        @font-face {
            font-family: 'Han Thong Kai';
            src: url('fonts/HanThongKai.woff2') format('woff2');
        }
        .ht-sample, .ht-paper {
            font-family: 'Han Thong Kai', 'Kaiti SC', 'KaiTi', serif;
            font-size: 20px;
            line-height: 1;
        }
        .ht-paper {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            margin-right: 4px;
            border-radius: 7px;
            box-shadow: inset 0 0 0 1px rgb(127 127 127 / 0.35);
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="my-3">Tùy chọn Hán Thông</h1>

    <h2 class="mb-3">Phiên âm</h2>

    <div class="form-group mb-4">
        <label>Phiên âm hiển thị quanh mỗi chữ Hán</label>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="showPinyin" name="showPinyin">
            <label class="custom-control-label" for="showPinyin">Pinyin (phía trên)</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="zhuyin" name="zhuyin">
            <label class="custom-control-label" for="zhuyin"><a
                    href="https://vi.wikipedia.org/wiki/Chú_âm_phù_hiệu" target="_blank">Chú âm (Bopomofo)</a>
                (bên phải, theo chiều dọc)</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="showHanViet" name="showHanViet">
            <label class="custom-control-label" for="showHanViet">Âm Hán-Việt (phía dưới)</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Tô màu pinyin và chú âm theo thanh điệu</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsOn" name="toneColors" class="custom-control-input"
                   value="true">
            <label class="custom-control-label" for="toneColorsOn">Tô màu</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="toneColorsOff" name="toneColors" class="custom-control-input"
                   value="false">
            <label class="custom-control-label" for="toneColorsOff">Không tô màu</label>
        </div>
    </div>

    <h2 class="mb-3">Giao diện cửa sổ tra từ</h2>

    <div class="form-group mb-4">
        <label>Font chữ Hán</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziFontKai" name="hanziFont" class="custom-control-input"
                   value="kai">
            <label class="custom-control-label" for="hanziFontKai">Chữ Khải (楷書), giống nét viết tay</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziFontDefault" name="hanziFont" class="custom-control-input"
                   value="default">
            <label class="custom-control-label" for="hanziFontDefault">Font mặc định của hệ thống</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label for="fontSize">Cỡ chữ Hán (pinyin, chú âm và âm Hán-Việt theo tỷ lệ cỡ chữ Hán)</label>
        <div class="d-flex align-items-center" style="max-width: 420px">
            <span class="text-muted mr-2" style="font-size: 12px">A</span>
            <input type="range" class="custom-range" id="fontSize" name="fontSize">
            <span class="text-muted ml-2" style="font-size: 18px">A</span>
            <span class="text-muted ml-3 text-nowrap" style="min-width: 3.5em"><span id="fontSizeValue"></span> px</span>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Màu chữ Hán</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziColorInk" name="hanziColor" class="custom-control-input" value="ink">
            <label class="custom-control-label" for="hanziColorInk"><span class="ht-sample" style="color: #1d1f23">中</span><span class="ht-sample" style="color: #1d1f23">文</span> Mực đen</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziColorBlue" name="hanziColor" class="custom-control-input" value="blue">
            <label class="custom-control-label" for="hanziColorBlue"><span class="ht-sample" style="color: #34558b">中</span><span class="ht-sample" style="color: #34558b">文</span> Mực xanh</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziColorBrown" name="hanziColor" class="custom-control-input" value="brown">
            <label class="custom-control-label" for="hanziColorBrown"><span class="ht-sample" style="color: #6e3b1f">中</span><span class="ht-sample" style="color: #6e3b1f">文</span> Mực nâu</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="hanziColorTone" name="hanziColor" class="custom-control-input" value="tone">
            <label class="custom-control-label" for="hanziColorTone"><span class="ht-sample" style="color: #d23a30">中</span><span class="ht-sample" style="color: #ac5d12">文</span> Theo thanh điệu</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Màu nền</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundAuto" name="background" class="custom-control-input" value="auto">
            <label class="custom-control-label" for="backgroundAuto"><span class="ht-paper" style="background: linear-gradient(135deg, #fcfcfa 50%, #15171a 50%); color: #8a8e96">文</span> Tự động (sáng hoặc tối theo hệ thống)</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundLight" name="background" class="custom-control-input" value="light">
            <label class="custom-control-label" for="backgroundLight"><span class="ht-paper" style="background: #fcfcfa; color: #1d1f23">文</span> Trắng</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundSepia" name="background" class="custom-control-input" value="sepia">
            <label class="custom-control-label" for="backgroundSepia"><span class="ht-paper" style="background: #f4ecdc; color: #3a2e22">文</span> Giấy</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundBlue" name="background" class="custom-control-input" value="blue">
            <label class="custom-control-label" for="backgroundBlue"><span class="ht-paper" style="background: #e6eef5; color: #1e2b38">文</span> Xanh</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundGray" name="background" class="custom-control-input" value="gray">
            <label class="custom-control-label" for="backgroundGray"><span class="ht-paper" style="background: #e4e4e1; color: #26282b">文</span> Xám</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="backgroundDark" name="background" class="custom-control-input" value="dark">
            <label class="custom-control-label" for="backgroundDark"><span class="ht-paper" style="background: #15171a; color: #e7e5e0">文</span> Tối</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Chữ giản thể và phồn thể</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="simpTradAuto" name="simpTrad" class="custom-control-input"
                   value="auto">
            <label class="custom-control-label" for="simpTradAuto">Hiện đúng dạng chữ đang có trên trang
                web (giản thể hoặc phồn thể)</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="simpTradClassic" name="simpTrad" class="custom-control-input"
                   value="classic">
            <label class="custom-control-label" for="simpTradClassic">Hiện chữ giản thể, kèm chữ phồn thể
                (nếu khác) ở cột nghĩa</label>
        </div>
    </div>

    <h2 class="mb-3">Nghĩa của từ</h2>

    <div class="form-group mb-4">
        <label>Số nghĩa hiển thị tối đa cho mỗi từ</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="maxSenses2" name="maxSenses" class="custom-control-input" value="2">
            <label class="custom-control-label" for="maxSenses2">2 nghĩa</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="maxSenses4" name="maxSenses" class="custom-control-input" value="4">
            <label class="custom-control-label" for="maxSenses4">4 nghĩa</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="maxSenses6" name="maxSenses" class="custom-control-input" value="6">
            <label class="custom-control-label" for="maxSenses6">6 nghĩa</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="maxSenses0" name="maxSenses" class="custom-control-input" value="0">
            <label class="custom-control-label" for="maxSenses0">Tất cả</label>
        </div>
    </div>

    <h2 class="mb-3">Tùy chọn khác</h2>

    <div class="form-group mb-4">
        <label>Chỉ tra từ khi giữ phím (để không hiện cửa sổ tra từ ở những chữ đã biết)</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="popupKeyNone" name="popupKey" class="custom-control-input" value="none">
            <label class="custom-control-label" for="popupKeyNone">Không, luôn tra từ khi rê chuột</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="popupKeyShift" name="popupKey" class="custom-control-input" value="shift">
            <label class="custom-control-label" for="popupKeyShift">Giữ <kbd>Shift</kbd></label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="popupKeyCtrl" name="popupKey" class="custom-control-input" value="ctrl">
            <label class="custom-control-label" for="popupKeyCtrl">Giữ <kbd>Ctrl</kbd></label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="popupKeyAlt" name="popupKey" class="custom-control-input" value="alt">
            <label class="custom-control-label" for="popupKeyAlt">Giữ <kbd>Alt</kbd> (<kbd>Option</kbd> trên Mac)</label>
        </div>
    </div>

    <div class="form-group mb-4">
        <label>Lưu vào danh sách từ vựng (phím r)</label>
        <div class="custom-control custom-radio">
            <input type="radio" id="saveToWordListAllEntries" name="saveToWordList"
                   class="custom-control-input" value="allEntries">
            <label class="custom-control-label" for="saveToWordListAllEntries">Lưu tất cả các mục</label>
        </div>
        <div class="custom-control custom-radio">
            <input type="radio" id="saveToWordListFirstEntryOnly" name="saveToWordList"
                   class="custom-control-input" value="firstEntryOnly">
            <label class="custom-control-label" for="saveToWordListFirstEntryOnly">Chỉ lưu mục đầu tiên</label>
        </div>
    </div>

</div>
<script src="js/config.js" ></script>
<script src="js/options.js" type="text/javascript"></script>
</body>
</html>
